# ─── Services ────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stickynotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stickynotes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d   # optional init scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stickynotes}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - stickynotes

  # ── pgAdmin 4 ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: stickynotes-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stickynotes

  # ── MinIO (object storage for note images) ────────────────
  minio:
    image: minio/minio:latest
    container_name: stickynotes-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # environment:
    #   MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    #   MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    env_file:
      - .env
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stickynotes

# ─── Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

# ─── Networks ────────────────────────────────────────────────
networks:
  stickynotes:
    driver: bridge
